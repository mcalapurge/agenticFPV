name: E2E (manual)

# Playwright end-to-end tests. Slow (~9 min across 6 runners), so they only
# run when started by hand: Actions tab -> "E2E (manual)" -> Run workflow,
# or: gh workflow run e2e.yml --ref <branch> [-f filter="e2e/title.spec.ts"]

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Optional spec file or --grep text (blank = whole suite)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright e2e (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run e2e
        env:
          FILTER: ${{ inputs.filter }}
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/6 ${FILTER:+"$FILTER"}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 14
